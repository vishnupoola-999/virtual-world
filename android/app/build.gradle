apply plugin: 'com.android.application'

// Release signing reads the upload keystore from the environment.
// ANDROID_KEYSTORE_FILE is a path to an already decoded keystore.
// When that is unset, ANDROID_KEYSTORE_BASE64 is decoded here (CI decodes
// the same secret before Gradle, and a local release build can pass it through).
// Passwords and the alias are trimmed; they are never written into the repo.
def releaseEnv = { String name ->
    def value = System.getenv(name)
    if (value == null) {
        return null
    }
    def trimmed = value.trim()
    return trimmed ? trimmed : null
}

def keystoreFileEnv = releaseEnv('ANDROID_KEYSTORE_FILE')
def releaseStorePassword = releaseEnv('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = releaseEnv('ANDROID_KEY_ALIAS')
def releaseKeyPassword = releaseEnv('ANDROID_KEY_PASSWORD')
def normalizedKeystoreBase64 = System.getenv('ANDROID_KEYSTORE_BASE64')?.replaceAll('\\s', '')
if (!normalizedKeystoreBase64) {
    normalizedKeystoreBase64 = null
}

def appProject = project
File releaseKeystoreFile = null
def releaseSigningError = null
if (keystoreFileEnv != null) {
    releaseKeystoreFile = file(keystoreFileEnv)
} else if (normalizedKeystoreBase64 != null) {
    releaseKeystoreFile = layout.buildDirectory.file('release.keystore').get().asFile
    releaseKeystoreFile.parentFile.mkdirs()
    try {
        releaseKeystoreFile.bytes = java.util.Base64.decoder.decode(normalizedKeystoreBase64)
    } catch (IllegalArgumentException ignored) {
        releaseSigningError = 'ANDROID_KEYSTORE_BASE64 is not valid base64.'
        releaseKeystoreFile = null
    }
    if (releaseKeystoreFile != null) {
        releaseKeystoreFile.setReadable(false, false)
        releaseKeystoreFile.setReadable(true, true)
        releaseKeystoreFile.setWritable(false, false)
        releaseKeystoreFile.setWritable(true, true)
        releaseKeystoreFile.setExecutable(false, false)
    }
}

def releaseSigningProblems = []
if (releaseStorePassword == null) {
    releaseSigningProblems << 'ANDROID_KEYSTORE_PASSWORD'
}
if (releaseKeyAlias == null) {
    releaseSigningProblems << 'ANDROID_KEY_ALIAS'
}
if (releaseKeyPassword == null) {
    releaseSigningProblems << 'ANDROID_KEY_PASSWORD'
}
if (releaseSigningError != null) {
    releaseSigningProblems << releaseSigningError
} else if (releaseKeystoreFile == null) {
    releaseSigningProblems << 'ANDROID_KEYSTORE_FILE or ANDROID_KEYSTORE_BASE64'
} else if (!releaseKeystoreFile.isFile() || releaseKeystoreFile.length() == 0L) {
    releaseSigningProblems << 'a non-empty keystore from ANDROID_KEYSTORE_FILE or ANDROID_KEYSTORE_BASE64'
}
def releaseSigningReady = releaseSigningProblems.isEmpty()
if (releaseSigningReady) {
    logger.lifecycle('Release signing configured from environment variables.')
}

android {
    namespace "com.vishnupoola.virtualworld"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.vishnupoola.virtualworld"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Committed debug key so CI and local debug APKs share one SHA-1.
    // store/key password and alias are the standard Android debug values.
    // Do not use this keystore for a Play release.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    if (releaseSigningReady) {
        signingConfigs {
            release {
                storeFile releaseKeystoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

def releaseTaskNames = ['assembleRelease', 'bundleRelease', 'packageRelease', 'packageReleaseBundle'] as Set
gradle.taskGraph.whenReady { graph ->
    def buildsRelease = graph.allTasks.any { task ->
        task.project == appProject && releaseTaskNames.contains(task.name)
    }
    if (buildsRelease && !releaseSigningReady) {
        throw new GradleException(
            'Refusing to build an unsigned release. Missing ' +
            releaseSigningProblems.join(', ') +
            '. assembleDebug does not need these. See docs/ENGINEERING_LOG.md.'
        )
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// google-services.json is produced by the Firebase console (Android app + SHA-1).
// CI does not have it; applying the plugin without the file fails the debug APK build.
try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    } else {
        logger.warn('android/app/google-services.json is empty. Google Services plugin not applied. Native Google sign-in will not work until the real file is added (see README).')
    }
} catch(Exception e) {
    logger.warn('android/app/google-services.json not found. Google Services plugin not applied. Native Google sign-in will not work until the file is added (see README). Debug APK build continues.')
}
