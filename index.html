<!doctype html><html><head><meta charset="utf-8"><link rel="icon" href="favicon.svg"><title>Virtual World – Prototype</title>
<style>body{margin:0;overflow:hidden;font-family:system-ui,sans-serif}#hud{position:fixed;top:10px;left:10px;background:#000a;color:#fff;padding:10px 14px;border-radius:8px;font-size:13px;max-width:330px}
#news{position:fixed;top:10px;right:10px;background:#fffe;padding:10px;border-radius:8px;font-size:12px;width:300px;max-height:45vh;overflow:auto;display:none}
.lbl{position:fixed;transform:translate(-50%,-100%);background:#fff;border-radius:6px;padding:2px 6px;font-size:11px;white-space:nowrap;pointer-events:none;box-shadow:0 1px 3px #0005}
button{margin:2px}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script></head><body>
<div id="hud"><b>🌍 Virtual World</b> <span id="place"></span><br>🕒 <b id="clock"></b> · speed <span id="spd">60</span>×
<button onclick="S.speed*=2">⏩</button><button onclick="S.speed=Math.max(1,S.speed/2)">⏪</button><br>
<button id="camBtn">Mode: Orbit</button><button onclick="document.getElementById('news').style.display=document.getElementById('news').style.display=='block'?'none':'block'">📰 Arjun's News</button><br>
<span id="stats"></span><br><span id="fam"></span><br><small>Orbit: drag/scroll. Fly: WASD + Q/E, drag to look. <a href="join.html" target="_blank" style="color:#9cf">Family: join</a></small></div>
<div id="news"><b>📰 Manikanta Daily – by Arjun</b><div id="newsLog"></div></div>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';
const W=await (await fetch('data/world.json')).json();
const Q=new URLSearchParams(location.search);const S=window.S={speed:+(Q.get('speed')||60),t:+(Q.get('t')||7.5)*3600,day:1};
document.getElementById('place').textContent='– '+W.center.name;
const scene=new THREE.Scene();scene.background=new THREE.Color(0xbfdfff);scene.fog=new THREE.Fog(0xbfdfff,1500,4000);
const cam=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,1,8000);cam.position.set(600,700,900);
const ren=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});ren.setSize(innerWidth,innerHeight);document.body.appendChild(ren.domElement);
const hemi=new THREE.HemisphereLight(0xffffff,0x667755,1.1);scene.add(hemi);const sun=new THREE.DirectionalLight(0xffffff,1.2);sun.position.set(500,1000,300);scene.add(sun);
// ground with OSM tiles (z16)
const Z=16,n=2**Z,tx=lon=>(lon+180)/360*n,ty=lat=>{const r=lat*Math.PI/180;return (1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n};
const cx=tx(W.center.lon),cy=ty(W.center.lat),tileM=40075016*Math.cos(W.center.lat*Math.PI/180)/n;
const grd=new THREE.Mesh(new THREE.PlaneGeometry(6000,6000),new THREE.MeshLambertMaterial({color:0xd8d2c0}));grd.rotation.x=-Math.PI/2;grd.position.y=-0.5;scene.add(grd);
const loader=new THREE.TextureLoader();loader.crossOrigin='anonymous';
for(let i=Math.floor(cx)-3;i<=Math.floor(cx)+3;i++)for(let j=Math.floor(cy)-3;j<=Math.floor(cy)+3;j++){
 loader.load(`https://tile.openstreetmap.org/${Z}/${i}/${j}.png`,tex=>{tex.colorSpace=THREE.SRGBColorSpace;const m=new THREE.Mesh(new THREE.PlaneGeometry(tileM,tileM),new THREE.MeshBasicMaterial({map:tex,transparent:true,opacity:.85}));
 m.rotation.x=-Math.PI/2;m.position.set((i+.5-cx)*tileM,0,(j+.5-cy)*tileM);scene.add(m);});}
// buildings merged
const geos=[];for(const b of W.buildings){if(b.pts.length<4)continue;const sh=new THREE.Shape(b.pts.map(p=>new THREE.Vector2(p[0],-p[1])));
 const g=new THREE.ExtrudeGeometry(sh,{depth:b.h,bevelEnabled:false});g.rotateX(-Math.PI/2);geos.push(g);}
const bm=new THREE.Mesh(mergeGeometries(geos),new THREE.MeshLambertMaterial({color:0xeeeae0}));scene.add(bm);
// roads
const rw={motorway:14,trunk:12,primary:11,secondary:9,tertiary:8,residential:5,service:3};const rpos=[];
for(const r of W.roads){for(let k=0;k<r.pts.length-1;k++){rpos.push(r.pts[k][0],1,r.pts[k][1],r.pts[k+1][0],1,r.pts[k+1][1]);}}
const rg=new THREE.BufferGeometry();rg.setAttribute('position',new THREE.Float32BufferAttribute(rpos,3));scene.add(new THREE.LineSegments(rg,new THREE.LineBasicMaterial({color:0x555555})));
// parks
for(const a of W.areas){if(!['park','garden','grass','playground','recreation_ground'].includes(a.type)||a.pts.length<4)continue;
 const g=new THREE.ShapeGeometry(new THREE.Shape(a.pts.map(p=>new THREE.Vector2(p[0],-p[1]))));g.rotateX(-Math.PI/2);const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({color:0x6cbf5a}));m.position.y=.3;scene.add(m);}
// road graph
const key=p=>p[0].toFixed(1)+','+p[1].toFixed(1),N=new Map();
const walk=W.roads.filter(r=>!['motorway','motorway_link','trunk_link','construction','proposed'].includes(r.type));
for(const r of walk)for(let k=0;k<r.pts.length;k++){const a=key(r.pts[k]);if(!N.has(a))N.set(a,{p:r.pts[k],e:[]});if(k){const b=key(r.pts[k-1]);N.get(a).e.push(b);N.get(b).e.push(a);}}
// largest component
let best=[],seen=new Set();for(const s of N.keys()){if(seen.has(s))continue;const c=[s];seen.add(s);for(let i=0;i<c.length;i++)for(const e of N.get(c[i]).e)if(!seen.has(e)){seen.add(e);c.push(e);}if(c.length>best.length)best=c;}
const nodes=best,within=k=>{const p=N.get(k).p;return Math.hypot(p[0],p[1])<1300};
const nearest=p=>{let b=null,d=1e9;for(const k of nodes){const q=N.get(k).p,dd=(q[0]-p[0])**2+(q[1]-p[1])**2;if(dd<d){d=dd;b=k}}return b};
function path(a,b){const prev=new Map([[a,null]]),Q=[a];for(let i=0;i<Q.length;i++){const u=Q[i];if(u==b)break;for(const v of N.get(u).e)if(!prev.has(v)){prev.set(v,u);Q.push(v);}}
 if(!prev.has(b))return[N.get(a).p];const out=[];for(let u=b;u;u=prev.get(u))out.unshift(N.get(u).p);return out;}
const rnd=(s=>()=>(s=(s*16807)%2147483647)/2147483647)(42),pick=a=>a[Math.floor(rnd()*a.length)];
const inner=nodes.filter(within);
const shops=W.shops.filter(s=>Math.hypot(...s.p)<1300),parks=W.parks.filter(s=>Math.hypot(...s.p)<1300);
const place=(name,p)=>({name,node:nearest(p)});
const shopPlaces=(shops.length?shops:[{p:[0,0],name:'Market'}]).map(s=>place(s.name,s.p));
const parkPlaces=(parks.length?parks:[{p:[300,300],name:'Park'}]).map(s=>place(s.name,s.p));
const school=place('School',[-400,200]);
// agents
const lblBox=document.body;
function mk(name,color,role){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.CylinderGeometry(4,4,12,10),new THREE.MeshLambertMaterial({color}));body.position.y=6;
 const head=new THREE.Mesh(new THREE.SphereGeometry(4,12,10),new THREE.MeshLambertMaterial({color:0xf1c27d}));head.position.y=15;g.add(body,head);g.scale.setScalar(1.8);scene.add(g);
 const el=document.createElement('div');el.className='lbl';lblBox.appendChild(el);
 const home=pick(inner);return {name,role,g,el,home:{name:'home',node:home},cur:home,route:[],ri:0,status:'',say:'',sayT:0,goal:null};}
const A=[mk('Ravi',0xe53935,'shopkeeper'),mk('Meera',0x8e24aa,'teacher'),mk('Arjun',0x1e88e5,'reporter'),
 mk('Priya',0xfdd835),mk('Kiran',0x43a047),mk('Lakshmi',0xfb8c00),mk('Sai',0x00acc1),mk('Anil',0x6d4c41)];
A[0].shop=shopPlaces[0];A[0].shop.name=A[0].shop.name+" (Ravi's)";
A.forEach(a=>{const p=N.get(a.cur).p;a.g.position.set(p[0],0,p[1]);a.gen=a.role?null:{shop:pick(shopPlaces),park:pick(parkPlaces),wake:6+rnd()*3,out:16+rnd()*3};});
function goTo(a,dest,status){if(a.goal===dest){a.status=(a.ri<a.route.length&&!status.startsWith('Walking'))?'🚶 Going: '+status:status;return;}a.goal=dest;a.status=status;a.route=path(a.cur,dest.node);a.ri=0;}
const hr=()=>(S.t/3600)%24;
function plan(a){const h=hr();
 if(a.role=='shopkeeper'){if(h>=7.3&&h<21)goTo(a,a.shop,(h>=8&&a.ri>=a.route.length)?'🏪 Shop open':'Walking to open shop');else goTo(a,a.home,h>=21&&h<21.5?'Closed shop, heading home':'😴 Home');}
 else if(a.role=='teacher'){if(h>=8&&h<13)goTo(a,school,'📚 Teaching class');else if(h>=16.5&&h<19)goTo(a,parkPlaces[0],'✏️ Tutoring at '+parkPlaces[0].name);else goTo(a,a.home,'Home');}
 else if(a.role=='reporter'){if(h>=7&&h<21){if(!a.route.length||a.ri>=a.route.length){const t=pick(A.filter(x=>x!==a));a.goal=null;goTo(a,{name:t.name,node:nearest([t.g.position.x,t.g.position.z])},'🎤 Looking for '+t.name);}}else goTo(a,a.home,'Writing up news');}
 else{const g=a.gen;if(h<g.wake||h>=22)goTo(a,a.home,'😴 Sleeping');else if(h<12)goTo(a,g.shop,'🛒 Shopping at '+g.shop.name);else if(h<g.out)goTo(a,a.home,'🏠 At home');else goTo(a,g.park,'🌳 Walk in '+g.park.name);}}
const log=[],news=document.getElementById('newsLog');
function addNews(s){const t=clockStr();log.unshift(`<div>Day ${S.day} ${t} – ${s}</div>`);if(log.length>60)log.pop();news.innerHTML=log.join('');}
const gossip=['said prices of tomatoes went up','saw a new café opening','heard the road will be repaired','is planning a cricket match on Sunday','says the park was crowded today','thinks it will rain tonight'];
function clockStr(){const h=Math.floor(hr()),m=Math.floor((S.t/60)%60);return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');}
let lastH=-1;
// family markers (local only)
const fam=new Map();const famCh=new BroadcastChannel('vw-family');
function famUpdate(d){if(d.stop){const f=fam.get(d.id);if(f){scene.remove(f.m);f.el.remove();fam.delete(d.id);}return;}
 let f=fam.get(d.id);if(!f){const m=new THREE.Mesh(new THREE.ConeGeometry(10,30,12),new THREE.MeshLambertMaterial({color:0xff1493}));m.rotation.x=Math.PI;const el=document.createElement('div');el.className='lbl';el.style.background='#ffd1ec';lblBox.appendChild(el);scene.add(m);f={m,el};fam.set(d.id,f);}
 const R=6378137,x=(d.lon-W.center.lon)*Math.PI/180*R*Math.cos(W.center.lat*Math.PI/180),z=-(d.lat-W.center.lat)*Math.PI/180*R;f.m.position.set(x,25,z);f.name='👪 '+d.name;f.ts=d.ts;}
famCh.onmessage=e=>famUpdate(e.data);
const loadLS=()=>{try{Object.values(JSON.parse(localStorage.getItem('vw-family')||'{}')).forEach(famUpdate)}catch{}};loadLS();addEventListener('storage',loadLS);
// controls
const orbit=new OrbitControls(cam,ren.domElement);orbit.target.set(0,0,0);orbit.maxPolarAngle=1.45;
let fly=false,keys={},yaw=0,pitch=-.3,drag=false;const btn=document.getElementById('camBtn');
btn.onclick=()=>{fly=!fly;orbit.enabled=!fly;btn.textContent='Mode: '+(fly?'Fly':'Orbit');if(fly){const d=new THREE.Vector3();cam.getWorldDirection(d);yaw=Math.atan2(-d.x,-d.z);pitch=Math.asin(d.y);}};
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
ren.domElement.addEventListener('mousedown',()=>drag=true);addEventListener('mouseup',()=>drag=false);
addEventListener('mousemove',e=>{if(fly&&drag){yaw-=e.movementX*.004;pitch=Math.max(-1.5,Math.min(1.5,pitch-e.movementY*.004));}});
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight);});
document.getElementById('stats').textContent=`${W.buildings.length} buildings · ${W.roads.length} roads · ${A.length} agents`;
const v=new THREE.Vector3();let last=performance.now();
function loop(now){const dt=Math.min(.1,(now-last)/1000);last=now;S.t+=dt*S.speed;if(S.t>=86400*S.day)S.day++;
 const h=Math.floor(hr());if(h!==lastH){lastH=h;if(h==8)addNews('Ravi opened his shop.');if(h==21)addNews('Ravi closed his shop for the day.');if(h==8)addNews('Meera started class at school.');if(h==17)addNews('Meera is tutoring kids at '+parkPlaces[0].name+'.');}
 for(const a of A){plan(a);const sp=1.4*S.speed*dt*(a.role=='reporter'?1.3:1);let move=sp;
  while(move>0&&a.ri<a.route.length){const t=a.route[a.ri],dx=t[0]-a.g.position.x,dz=t[1]-a.g.position.z,d=Math.hypot(dx,dz);
   if(d<=move){a.g.position.x=t[0];a.g.position.z=t[1];move-=d;a.ri++;}else{a.g.position.x+=dx/d*move;a.g.position.z+=dz/d*move;a.g.rotation.y=Math.atan2(dx,dz);move=0;}}
  if(a.ri>=a.route.length&&a.goal)a.cur=a.goal.node;
  if(a.sayT>0)a.sayT-=dt;}
 // encounters
 for(let i=0;i<A.length;i++)for(let j=i+1;j<A.length;j++){const a=A[i],b=A[j];if(a.g.position.distanceTo(b.g.position)<15){
  for(const [x,y] of [[a,b],[b,a]]){if(x.sayT>0)continue;
   if(x.role=='shopkeeper'&&x.status.includes('open')){x.say='Namaste '+y.name+'! Fresh stock today 🙂';x.sayT=3;}
   else if(x.role=='reporter'){const g=pick(gossip);x.say=y.name+', any news?';x.sayT=3;y.say='I '+g.replace(/^(said|says|thinks|is|saw|heard)/,m=>({said:'say',says:'say',thinks:'think',is:'am',saw:'saw',heard:'heard'}[m]));y.sayT=3;addNews(`${y.name} ${g}.`);x.route=[];x.goal=null;}
  }}}
 if(fly){const s=(keys.shift?600:200)*dt,f=new THREE.Vector3(-Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch)),r=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
  if(keys.w)cam.position.addScaledVector(f,s);if(keys.s)cam.position.addScaledVector(f,-s);if(keys.d)cam.position.addScaledVector(r,s);if(keys.a)cam.position.addScaledVector(r,-s);if(keys.e)cam.position.y+=s;if(keys.q)cam.position.y-=s;
  cam.lookAt(cam.position.clone().add(f));}else orbit.update();
 const lab=(obj,el,txt)=>{v.copy(obj.position);v.y+=40;v.project(cam);if(v.z>1||Math.abs(v.x)>1.1||Math.abs(v.y)>1.1){el.style.display='none';return;}el.style.display='';el.style.left=(v.x+1)/2*innerWidth+'px';el.style.top=(1-v.y)/2*innerHeight+'px';el.textContent=txt;};
 for(const a of A)lab(a.g,a.el,`${a.name}${a.role?' ('+a.role+')':''}: ${a.sayT>0?'💬 '+a.say:a.status}`);
 for(const f of fam.values())lab(f.m,f.el,f.name);
 document.getElementById('clock').textContent='Day '+S.day+' '+clockStr();document.getElementById('spd').textContent=S.speed;
 document.getElementById('fam').textContent=`👪 Family online: ${fam.size}`;
 ren.render(scene,cam);requestAnimationFrame(loop);}
window.__ready=true;requestAnimationFrame(loop);
</script></body></html>
