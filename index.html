<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="favicon.svg"><title>Virtual World</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="src/style.css">
</head><body>
<div id="map"></div>
<div id="panel">
 <h1>🌍 Virtual World</h1>
 <div class="row"><button id="signInBtn">🔐 Sign in with Google</button><span id="userChip" hidden><img id="userPic" alt=""><span id="userName"></span> <button id="signOutBtn">Sign out</button></span></div>
 <div id="agentBox" hidden><b>🤖 My agent</b>
  <div id="agView" hidden><div id="agTitle"></div><small id="agDesc"></small><div class="row"><button id="agGo">🎯 Go to</button><button id="agMove">📍 Move here</button><button id="agEdit">✏️ Edit</button></div></div>
  <form id="agForm" hidden><input id="agName" placeholder="Agent name" maxlength="40"><div class="row"><input id="agEmoji" value="🤖" maxlength="4" size="3"><input id="agColor" type="color" value="#7e57c2"></div>
  <textarea id="agPers" placeholder="Short personality, e.g. friendly study buddy" maxlength="300" rows="2"></textarea><button id="agSave"></button></form>
  <small id="agMsg"></small></div><hr>
 <form id="searchF"><input id="q" placeholder="Search any place on Earth…" autocomplete="off"><button>🔎</button></form>
 <div id="results"></div>
 <div class="row"><button id="meBtn">📍 My location</button><button id="homeBtn">🏠 Hanamkonda</button><button id="globeBtn">🌐 Globe</button></div>
 <div class="row"><button id="fltBtn">✈️ Flights: OFF</button><small id="fltMsg"></small></div>
 <hr><b>👪 Family</b> <span id="famN">0</span> live <small id="famConn"></small>
 <div class="row"><button id="shareBtn">🔗 Share join link</button><a id="joinLink" target="_blank">Join myself</a></div>
 <small id="shareMsg"></small><div id="famList"></div>
 <small id="status"></small>
</div>
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script type="module" src="src/main.js"></script>
</body></html>
