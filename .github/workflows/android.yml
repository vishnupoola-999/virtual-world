# Debug APK for the Capacitor Android wrapper.
# Capacitor 6.2.2 is pinned because its Android library compiles as Java 17.
# Capacitor 7+ sets sourceCompatibility to Java 21 and fails on this JDK.

name: Android

on:
  push:

permissions:
  contents: read
  actions: write

jobs:
  debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # v3 still installs the removed "tools" package and fails with
      # "Failed to find package 'tools'". v4 installs platform-tools only.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Install npm dependencies
        run: npm ci

      - name: Check web popup path and native id-token path
        run: npm run check:auth

      - name: Copy static site into Capacitor webDir
        run: npm run copy:web

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Print stable debug certificate fingerprints
        working-directory: android
        run: |
          sha1=$(keytool -list -v -keystore app/debug.keystore -alias androiddebugkey -storepass android | awk -F'SHA1: ' '/SHA1:/{print $2; exit}')
          sha256=$(keytool -list -v -keystore app/debug.keystore -alias androiddebugkey -storepass android | awk -F'SHA256: ' '/SHA256:/{print $2; exit}')
          echo "SHA1: $sha1"
          echo "SHA256: $sha256"
          test "$sha1" = "DA:FA:69:87:D1:51:B0:89:95:23:99:1C:AB:80:24:2B:16:47:DA:5B"
          test "$sha256" = "04:63:58:67:E3:0B:0F:51:0C:E8:06:8B:F2:EA:3E:BA:85:64:2E:4D:9C:3A:92:38:5B:62:9A:77:C3:2F:15:2A"

      - name: Build debug APK
        working-directory: android
        run: chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: virtual-world-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
