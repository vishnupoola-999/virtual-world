# Android packages for the Capacitor wrapper.
# Always builds the debug APK (committed debug keystore).
# When ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
# and ANDROID_KEY_PASSWORD are all set, also builds a signed release APK and AAB.
# When none of them are set, the release steps are skipped and this job still passes.
# A partial set fails the job after the debug APK is uploaded.
# Capacitor 6.2.2 is pinned because its Android library compiles as Java 17.
# Capacitor 7+ sets sourceCompatibility to Java 21 and fails on this JDK.

name: Android

on:
  push:

permissions:
  contents: read
  actions: write

jobs:
  debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # v3 still installs the removed "tools" package and fails with
      # "Failed to find package 'tools'". v4 installs platform-tools only.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Install npm dependencies
        run: npm ci

      - name: Check web popup path and native id-token path
        run: npm run check:auth

      - name: Copy static site into Capacitor webDir
        run: npm run copy:web

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Print stable debug certificate fingerprints
        working-directory: android
        run: |
          sha1=$(keytool -list -v -keystore app/debug.keystore -alias androiddebugkey -storepass android | awk -F'SHA1: ' '/SHA1:/{print $2; exit}')
          sha256=$(keytool -list -v -keystore app/debug.keystore -alias androiddebugkey -storepass android | awk -F'SHA256: ' '/SHA256:/{print $2; exit}')
          echo "SHA1: $sha1"
          echo "SHA256: $sha256"
          test "$sha1" = "DA:FA:69:87:D1:51:B0:89:95:23:99:1C:AB:80:24:2B:16:47:DA:5B"
          test "$sha256" = "04:63:58:67:E3:0B:0F:51:0C:E8:06:8B:F2:EA:3E:BA:85:64:2E:4D:9C:3A:92:38:5B:62:9A:77:C3:2F:15:2A"

      - name: Build debug APK
        working-directory: android
        run: chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: virtual-world-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Check release signing secrets
        id: release_signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          is_set() {
            local value="${1-}"
            value="${value//[[:space:]]/}"
            [ -n "$value" ]
          }
          missing=()
          is_set "$ANDROID_KEYSTORE_BASE64" || missing+=("ANDROID_KEYSTORE_BASE64")
          is_set "$ANDROID_KEYSTORE_PASSWORD" || missing+=("ANDROID_KEYSTORE_PASSWORD")
          is_set "$ANDROID_KEY_ALIAS" || missing+=("ANDROID_KEY_ALIAS")
          is_set "$ANDROID_KEY_PASSWORD" || missing+=("ANDROID_KEY_PASSWORD")
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are set. Building a signed release APK and AAB."
          elif [ "${#missing[@]}" -eq 4 ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are unset. Debug APK only."
          else
            echo "Release signing secrets are incomplete. Missing: ${missing[*]}"
            exit 1
          fi

      - name: Decode release keystore
        if: steps.release_signing.outputs.enabled == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p app/build
          encoded="$(mktemp)"
          trap 'rm -f "$encoded"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' > "$encoded"
          base64 --decode < "$encoded" > app/build/release.keystore
          test -s app/build/release.keystore

      - name: Print release certificate fingerprints
        if: steps.release_signing.outputs.enabled == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          listing="$(keytool -list -v -keystore app/build/release.keystore -alias "$ANDROID_KEY_ALIAS" -storepass:env ANDROID_KEYSTORE_PASSWORD)"
          sha1="$(printf '%s\n' "$listing" | awk -F'SHA1: ' '/SHA1:/{print $2; exit}')"
          sha256="$(printf '%s\n' "$listing" | awk -F'SHA256: ' '/SHA256:/{print $2; exit}')"
          test -n "$sha1"
          test -n "$sha256"
          test "$sha1" != "DA:FA:69:87:D1:51:B0:89:95:23:99:1C:AB:80:24:2B:16:47:DA:5B"
          echo "Release SHA-1: $sha1"
          echo "Release SHA-256: $sha256"
          echo "Add both fingerprints to the Firebase Android app com.vishnupoola.virtualworld."
          {
            echo "RELEASE_SHA1=$sha1"
            echo "RELEASE_SHA256=$sha256"
          } >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        if: steps.release_signing.outputs.enabled == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Verify release signatures
        if: steps.release_signing.outputs.enabled == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          apk="app/build/outputs/apk/release/app-release.apk"
          aab="app/build/outputs/bundle/release/app-release.aab"
          test -s "$apk"
          test -s "$aab"
          apksigner="${ANDROID_HOME}/build-tools/34.0.0/apksigner"
          "$apksigner" verify --print-certs "$apk"
          apk_sha1="$("$apksigner" verify --print-certs "$apk" | awk -F'SHA-1 digest: ' '/SHA-1 digest:/{print $2; exit}')"
          normalize() { printf '%s' "$1" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]' | tr -d ':'; }
          test "$(normalize "$apk_sha1")" = "$(normalize "$RELEASE_SHA1")"
          aab_log="$(mktemp)"
          if ! jarsigner -verify "$aab" > "$aab_log" 2>&1; then
            cat "$aab_log"
            exit 1
          fi
          grep -q "jar verified" "$aab_log"
          rm -f "$aab_log"

      - name: Upload release APK
        if: steps.release_signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: virtual-world-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release AAB
        if: steps.release_signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: virtual-world-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
