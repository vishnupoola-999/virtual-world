# Debug APK for the Capacitor Android wrapper.
# Capacitor 6.2.2 is pinned because its Android library compiles as Java 17.
# Capacitor 7+ sets sourceCompatibility to Java 21 and fails on this JDK.

name: Android

on:
  push:

permissions:
  contents: read
  actions: write

jobs:
  debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # v3 still installs the removed "tools" package and fails with
      # "Failed to find package 'tools'". v4 installs platform-tools only.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Install npm dependencies
        run: npm ci

      - name: Copy static site into Capacitor webDir
        run: npm run copy:web

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: virtual-world-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
